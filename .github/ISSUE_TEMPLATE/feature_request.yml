name: Feature request
description: Suggest a feature or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find an equivalent request.
          required: true
        - label: This request does not contain credentials or personal data.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what you are trying to do and the limitation you encounter.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how the feature should work, with an example if possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative approaches.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security impact
      description: Note any known effects on existing clients, deployment requirements, or data access. Leave blank if unknown.
