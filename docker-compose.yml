name: mimicwx

services:
  mimicwx:
    build:
      context: .
      args:
        USE_MIRROR: "${MIMICWX_USE_MIRROR:-1}"
    image: ${MIMICWX_IMAGE:-local/mimicwx-linux:0.6.0}
    container_name: mimicwx-linux
    network_mode: bridge
    init: true
    stdin_open: true
    tty: true
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    ports:
      - "${MIMICWX_BIND_IP:-127.0.0.1}:6080:6080"
      - "${MIMICWX_BIND_IP:-127.0.0.1}:8899:8899"
    environment:
      TZ: Asia/Shanghai
      VNC_PASSWORD_FILE: /run/secrets/vnc_password
    secrets:
      - vnc_password
    volumes:
      - ./data/xwechat:/home/wechat/.xwechat
      - ./data/xwechat_files:/home/wechat/Documents/xwechat_files
      - ${MIMICWX_CONFIG_FILE:-./config.toml}:/home/wechat/mimicwx-linux/config.toml
    shm_size: 512m
    tmpfs:
      - /tmp:size=1g,mode=1777
    pids_limit: 1024
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8899/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

secrets:
  vnc_password:
    file: ./secrets/vnc_password.txt
